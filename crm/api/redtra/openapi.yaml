  /api/agents/{agent_id}/available-slots:
    get:
      tags:
      - Agents
      summary: Get available appointment slots for an agent
      security: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      - in: query
        name: date
        description: Single date filter (YYYY-MM-DD). If provided, returns slots for only this date.
        schema:
          type: string
          format: date
      - in: query
        name: start_date
        description: Start date for date range (used when 'date' is not provided). Defaults to today.
        schema:
          type: string
          format: date
      - in: query
        name: end_date
        description: End date for date range. Defaults to 7 days from start_date.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Available slots grouped by date
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                  max_appointment_minutes:
                    type: integer
                  date:
                    type: string
                    format: date
                    description: Present when using single date filter
                  start_date:
                    type: string
                    format: date
                    description: Present when using date range
                  end_date:
                    type: string
                    format: date
                    description: Present when using date range
                  available_slots:
                    type: object
                    description: Slots grouped by date
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          start_datetime:
                            type: string
                            format: date-time
                          end_datetime:
                            type: string
                            format: date-time
                          time:
                            type: string
        '403':
          $ref: '#/components/responses/ForbiddenError'
