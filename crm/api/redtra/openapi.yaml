          name: property_types
          description: Filter by one or more property types.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: bedrooms
          description: Include properties matching any of the supplied bedroom counts.
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - in: query
          name: min_bedrooms
          schema:
            type: integer
        - in: query
          name: max_bedrooms
          schema:
            type: integer
        - in: query
          name: bathrooms
          description: Include properties matching any of the supplied bathroom counts.
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - in: query
          name: min_bathrooms
          schema:
            type: integer
        - in: query
          name: max_bathrooms
          schema:
            type: integer
