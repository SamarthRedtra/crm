openapi: 3.0.3
info:
  title: Redtra Property Booking API
  version: 1.0.0
servers:
- url: https://your-domain.com
  description: Production
tags:
- name: Authentication
- name: Users
- name: Areas
- name: Properties
- name: Developers
- name: Agencies
- name: Favorites
- name: Appointments
- name: Notifications
- name: Agents
- name: Home
- name: Media
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      example:
        message: Operation completed successfully.
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
      example:
        error:
          code: validation_error
          message: Validation error
          details:
            fieldname: property_id
    RegisterRequest:
      type: object
      required:
      - full_name
      - email
      - password
      properties:
        full_name:
          type: string
          example: Anwar Khan
        email:
          type: string
          format: email
          example: anwar@example.com
        password:
          type: string
          format: password
          example: StrongPassword123!
        phone:
          type: string
          example: +91-9876543210
        is_agent:
          type: boolean
          description: Pass true to create an Agent account instead of a Customer.
          example: false
        whatsapp_number:
          type: string
          example: '+971500000001'
        bio:
          type: string
          example: Dubai Marina specialist with 10 years of experience.
        max_daily_appointments:
          type: integer
        agent_id:
          type: string
          description: Optional DFD registration ID that links the signup to an existing
            Agent.
        kyc_documents:
          type: array
          items:
            $ref: '#/components/schemas/AgentKYCDocumentInput'
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        remember_me:
          type: boolean
          description: Remember the user for future logins (extends token expiration to 7 days).
          example: true
    ForgotPasswordRequest:
      type: object
      required:
      - email
      - password
      - new_password
      properties:
        email:
          type: string
          format: email
          example: anwar@example.com
        password:
          type: string
          format: password
          description: New password
        new_password:
          type: string
          format: password
          description: Confirm new password; must match password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
        user_id:
          type: string
        full_name:
          type: string
        remember_me:
          type: boolean
          description: Whether remember_me was set during login
        token_expires_in_hours:
          type: integer
          description: Token expiration time in hours (24 for normal, 168 for remember_me)
    ProfileResponse:
      type: object
      properties:
        user_id:
          type: string
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        whatsapp_number:
          type: string
        preferred_city:
          type: string
        agent_profile:
          type: object
          nullable: true
          properties:
            id:
              type: string
            status:
              type: string
            about_me:
              type: string
            profile_image:
              type: string
              format: uri
            max_daily_appointments:
              type: integer
        appointments_today:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              start:
                type: string
                format: date-time
              end:
                type: string
                format: date-time
              status:
                type: string
              property:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
              customer:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
        properties:
          type: array
          items:
            $ref: '#/components/schemas/PropertySummary'
        lead_stats:
          type: object
          properties:
            total:
              type: integer
            today:
              type: integer
            last_month_same_day:
              type: integer
            trend_ratio:
              type: number
              format: float
              nullable: true
    ProfileUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        whatsapp_number:
          type: string
        preferred_city:
          type: string
        about_me:
          type: string
        profile_image:
          type: string
          format: uri
        max_daily_appointments:
          type: integer
    AgentKYCDocumentInput:
      type: object
      required:
      - document_type
      - document_file
      properties:
        document_type:
          type: string
          example: License
        document_file:
          type: string
          format: uri
          example: https://cdn.example.com/agents/documents/license.pdf
        remarks:
          type: string
          example: Expires 2026
    Area:
      type: object
      properties:
        id:
          type: string
          example: AREA-0001
        area_name:
          type: string
          example: Indiranagar
        city:
          type: string
          example: Bangalore
        state:
          type: string
          example: Karnataka
        country:
          type: string
          example: India
        pincode:
          type: string
          example: '560038'
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        geo_json:
          type: string
          description: Optional GeoJSON boundary for the area.
    PaginatedAreaList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Area'
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total_items:
          type: integer
          example: 120
        total_pages:
          type: integer
          example: 6
    PropertyAmenity:
      type: object
      properties:
        amenity_name:
          type: string
          example: Gym
    PropertyImage:
      type: object
      properties:
        image:
          type: string
          format: uri
          example: https://cdn.example.com/properties/PROP-00001/1.jpg
        caption:
          type: string
        sort_order:
          type: integer
    PropertySummary:
      type: object
      properties:
        id:
          type: string
          example: PROP-00001
        title:
          type: string
          example: 2 BHK Apartment in Indiranagar
        listing_type:
          type: string
          enum:
          - Buy
          - Rent
          - Off Plan
        property_type:
          type: string
          example: Apartment
        property_category:
          type: string
          enum:
          - Residential
          - Commercial
          - Mixed Use
        price:
          type: number
          format: float
          example: 7500000
        currency:
          type: string
          example: INR
        bedrooms:
          type: integer
          example: 2
        bathrooms:
          type: integer
          example: 2
        area_sqft:
          type: number
          format: float
          example: 1150
        city:
          type: string
          example: Bangalore
        area:
          type: string
          example: AREA-0001
        area_name:
          type: string
          example: Indiranagar
        developer:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/DeveloperDetail'
        developer_name:
          type: string
          example: Sunrise Builders
        primary_image_url:
          type: string
          format: uri
          example: https://cdn.example.com/properties/PROP-00001/main.jpg
        location:
          type: string
          example: Indiranagar, Bangalore
        furnishing_status:
          type: string
          example: Furnished
        is_featured:
          type: boolean
          example: true
        featured_until:
          type: string
          format: date-time
          nullable: true
        featured_remaining_seconds:
          type: integer
          example: 86400
        agent:
          type: object
          nullable: true
          properties:
            id:
              type: string
              example: AGENT-0005
            name:
              type: string
            phone:
              type: string
            whatsapp_number:
              type: string
            whatsapp_link:
              type: string
              format: uri
            profile_image:
              type: string
              format: uri
            status:
              type: string
        agency:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AgencySummary'
    PropertyDetail:
      allOf:
      - $ref: '#/components/schemas/PropertySummary'
      - type: object
        properties:
          status:
            type: string
            enum:
            - Draft
            - Under Verification
            - Active
            - Inactive
          description:
            type: string
          latitude:
            type: number
            format: float
          longitude:
            type: number
            format: float
          address_line1:
            type: string
          address_line2:
            type: string
          state:
            type: string
          country:
            type: string
          pincode:
            type: string
          amenities:
            type: array
            items:
              type: string
          gallery:
            type: array
            items:
              $ref: '#/components/schemas/PropertyImage'
          agent:
            type: object
            properties:
              id:
                type: string
                example: AGENT-0005
              name:
                type: string
                example: Rahul Sharma
              phone:
                type: string
                example: +91-9876543210
              whatsapp_number:
                type: string
                example: +91-9876543210
              whatsapp_link:
                type: string
                format: uri
          developer_id:
            type: string
            nullable: true
            description: Developer ID if assigned.
          developer_name:
            type: string
            nullable: true
          developer:
            nullable: true
            allOf:
            - $ref: '#/components/schemas/DeveloperDetail'
          whatsapp_chat_link:
            type: string
            format: uri
            nullable: true
            example: https://wa.me/919876543210?text=Hi%20I%20am%20interested%20in%20PROP-00001
    PropertyCreateRequest:
      type: object
      required:
      - title
      - listing_type
      - property_type
      - price
      - currency
      properties:
        title:
          type: string
        description:
          type: string
        listing_type:
          type: string
          enum:
          - Buy
          - Rent
          - Off Plan
        property_type:
          type: string
        price:
          type: number
          format: float
        currency:
          type: string
        property_category:
          type: string
          enum:
          - Residential
          - Commercial
          - Mixed Use
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        furnishing_status:
          type: string
          enum:
          - Furnished
          - Semi-Furnished
          - Unfurnished
        area_sqft:
          type: number
          format: float
        area_id:
          type: string
          description: ID of Area
        developer_id:
          type: string
          description: ID of Developer
        address_line1:
          type: string
        address_line2:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        pincode:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        amenities:
          type: array
          items:
            oneOf:
            - type: string
            - $ref: '#/components/schemas/PropertyAmenity'
        gallery:
          type: array
          items:
            $ref: '#/components/schemas/PropertyImage'
        is_featured:
          type: boolean
        featured_until:
          type: string
          format: date-time
        agent:
          type: string
          description: Optional explicit Agent ID (defaults to logged-in agent)
    PropertyUpdateRequest:
      allOf:
      - $ref: '#/components/schemas/PropertyCreateRequest'
    PaginatedPropertyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PropertySummary'
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    DeveloperSummary:
      type: object
      properties:
        id:
          type: string
          example: DEV-0001
        name:
          type: string
          example: Sunrise Builders
        status:
          type: string
          enum:
          - Active
          - Inactive
        city:
          type: string
          example: Dubai
        state:
          type: string
          example: Dubai
        country:
          type: string
          example: UAE
        website:
          type: string
          format: uri
          example: https://sunrise.example.com
        logo:
          type: string
          format: uri
          example: https://cdn.example.com/developers/DEV-0001/logo.png
        location:
          type: string
          example: Dubai, UAE
        property_count:
          type: integer
          description: Number of active properties associated with this developer
            (when requested).
    DeveloperDetail:
      allOf:
      - $ref: '#/components/schemas/DeveloperSummary'
      - type: object
        properties:
          email:
            type: string
            format: email
            example: info@sunrise.example.com
          phone:
            type: string
            example: '+971500000001'
          address_line1:
            type: string
          address_line2:
            type: string
          pincode:
            type: string
          description:
            type: string
    AgencySummary:
      type: object
      properties:
        id:
          type: string
          example: AGY-0001
        name:
          type: string
          example: Redtra Realty
        status:
          type: string
          enum:
          - Active
          - Inactive
        city:
          type: string
        state:
          type: string
        country:
          type: string
        logo:
          type: string
          format: uri
        website:
          type: string
          format: uri
        phone:
          type: string
        email:
          type: string
          format: email
        location:
          type: string
    AgencyDetail:
      allOf:
      - $ref: '#/components/schemas/AgencySummary'
      - type: object
        properties:
          address_line1:
            type: string
          address_line2:
            type: string
          pincode:
            type: string
          description:
            type: string
          metadata:
            type: object
            properties:
              creation:
                type: string
                format: date-time
              modified:
                type: string
                format: date-time
              owner:
                type: string
              modified_by:
                type: string
    DeveloperCreateRequest:
      type: object
      required:
      - developer_name
      properties:
        developer_name:
          type: string
        status:
          type: string
          enum:
          - Active
          - Inactive
        email:
          type: string
          format: email
        phone:
          type: string
        website:
          type: string
          format: uri
        address_line1:
          type: string
        address_line2:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        pincode:
          type: string
        logo:
          type: string
          format: uri
        description:
          type: string
    PaginatedDeveloperList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeveloperSummary'
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    NotificationItem:
      type: object
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        type:
          type: string
        title:
          type: string
        message:
          type: string
        read:
          type: boolean
        from_user:
          type: object
          properties:
            id:
              type: string
            full_name:
              type: string
        reference:
          type: object
          properties:
            doctype:
              type: string
            name:
              type: string
    NotificationListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationItem'
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    MarkNotificationsReadRequest:
      type: object
      properties:
        notification_ids:
          type: array
          description: Optional list of notification IDs to mark as read. If omitted,
            all unread notifications are updated.
          items:
            type: string
    MarkNotificationsReadResponse:
      type: object
      properties:
        updated:
          type: integer
    FavoriteItem:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        property:
          $ref: '#/components/schemas/PropertySummary'
    FavoriteCreateRequest:
      type: object
      required:
      - property_id
      properties:
        property_id:
          type: string
          example: PROP-00001
    AppointmentRequest:
      type: object
      required:
      - property_id
      - start_datetime
      - end_datetime
      properties:
        property_id:
          type: string
          example: PROP-00001
        agent:
          type: string
          description: "Deprecated \u2013 property agent is assigned automatically."
        start_datetime:
          type: string
          format: date-time
          example: '2025-12-10T10:00:00Z'
        end_datetime:
          type: string
          format: date-time
          example: '2025-12-10T11:00:00Z'
        notes:
          type: string
    AppointmentUpdateRequest:
      type: object
      properties:
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        notes:
          type: string
    Appointment:
      type: object
      properties:
        id:
          type: string
          example: APPT-0001
        status:
          type: string
          enum:
          - Scheduled
          - Completed
          - Cancelled
          - No-show
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        notes:
          type: string
        source:
          type: string
          enum:
          - Mobile App
          - Web
          - Admin
        customer:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            phone:
              type: string
            email:
              type: string
        agent:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            phone:
              type: string
            whatsapp_number:
              type: string
            whatsapp_link:
              type: string
              format: uri
        property:
          $ref: '#/components/schemas/PropertySummary'
        calendar_event:
          type: string
          nullable: true
          description: Linked calendar event ID (Event doctype).
    WhatsAppLinkResponse:
      type: object
      properties:
        whatsapp_chat_link:
          type: string
          format: uri
    FileUploadRequest:
      type: object
      required:
      - file_name
      - filedata
      properties:
        file_name:
          type: string
          example: living-room.jpg
        filedata:
          type: string
          description: Base64 encoded file payload (data URI or raw base64).
    FileUploadResponse:
      type: object
      properties:
        id:
          type: string
        file_name:
          type: string
        file_url:
          type: string
          format: uri
        is_private:
          type: boolean
    AgentSummary:
      type: object
      properties:
        id:
          type: string
          example: AGENT-0001
        name:
          type: string
          example: Ayesha Khan
        status:
          type: string
          example: Verified
        bio:
          type: string
          example: Dubai Marina specialist with 10 years of experience.
        phone:
          type: string
          example: '+971500000123'
        whatsapp_number:
          type: string
          example: '+971500000123'
        whatsapp_link:
          type: string
          format: uri
        profile_image:
          type: string
          format: uri
          example: https://cdn.example.com/agents/agent-1.png
        property_count:
          type: integer
          example: 12
        agency:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AgencySummary'
    AgentDetail:
      allOf:
      - $ref: '#/components/schemas/AgentSummary'
      - type: object
        properties:
          brn_id:
            type: string
          active_properties:
            type: integer
          property_ids:
            type: array
            items:
              type: string
          sales:
            type: integer
          leads:
            type: integer
          expertise:
            type: object
            properties:
              property_types:
                type: array
                items:
                  type: string
              property_categories:
                type: array
                items:
                  type: string
          max_daily_appointments:
            type: integer
          max_appointment_minutes:
            type: integer
          availability_slots:
            type: array
            items:
              type: object
              properties:
                day_of_week:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
          properties:
            type: array
            items:
              $ref: '#/components/schemas/PropertySummary'
          ratings:
            type: object
    PaginatedAgentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentSummary'
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    HomeData:
      type: object
      properties:
        featured_properties:
          type: array
          items:
            $ref: '#/components/schemas/PropertySummary'
        areas:
          type: array
          items:
            $ref: '#/components/schemas/Area'
        developers:
          type: array
          items:
            $ref: '#/components/schemas/DeveloperSummary'
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentSummary'
  responses:
    UnauthorizedError:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Access forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /api/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a new customer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/auth/login:
    post:
      tags:
      - Authentication
      summary: Login and get JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/forgot-password:
    post:
      tags:
      - Authentication
      summary: Reset password
      description: Directly sets a new password for the specified account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Password reset completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/auth/logout:
    post:
      tags:
      - Authentication
      summary: Revoke the current JWT token
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/user/profile:
    get:
      tags:
      - Users
      summary: Get current user profile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
