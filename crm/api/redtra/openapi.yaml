openapi: 3.0.3
info:
  title: Redtra Property Booking API
  version: 1.0.0
servers:
  - url: https://your-domain.com
    description: Production
tags:
  - name: Authentication
  - name: Users
  - name: Areas
  - name: Properties
  - name: Developers
  - name: Favorites
  - name: Appointments
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      example:
        message: Operation completed successfully.
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
      example:
        error:
          code: validation_error
          message: Validation error
          details:
            fieldname: property_id
    RegisterRequest:
      type: object
      required: [full_name, email, password]
      properties:
        full_name:
          type: string
          example: "Anwar Khan"
        email:
          type: string
          format: email
          example: "anwar@example.com"
        password:
          type: string
          format: password
          example: "StrongPassword123!"
        phone:
          type: string
          example: "+91-9876543210"
        is_agent:
          type: boolean
          description: Pass true to create an Agent account instead of a Customer.
          example: false
        whatsapp_number:
          type: string
          example: "+971500000001"
        bio:
          type: string
          example: "Dubai Marina specialist with 10 years of experience."
        max_daily_appointments:
          type: integer
          example: 8
        kyc_documents:
          type: array
          items:
            $ref: '#/components/schemas/AgentKYCDocumentInput'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ForgotPasswordRequest:
      type: object
      required: [email, password, new_password]
      properties:
        email:
          type: string
          format: email
          example: "anwar@example.com"
        password:
          type: string
          format: password
          description: New password
        new_password:
          type: string
          format: password
          description: Confirm new password; must match password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
        user_id:
          type: string
        full_name:
          type: string
    ProfileResponse:
      type: object
      properties:
        user_id:
          type: string
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        whatsapp_number:
          type: string
        preferred_city:
          type: string
    ProfileUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        whatsapp_number:
          type: string
        preferred_city:
          type: string
    AgentKYCDocumentInput:
      type: object
      required: [document_type, document_file]
      properties:
        document_type:
          type: string
          example: "License"
        document_file:
          type: string
          format: uri
          example: "https://cdn.example.com/agents/documents/license.pdf"
        remarks:
          type: string
          example: "Expires 2026"
    Area:
      type: object
      properties:
        id:
          type: string
          example: "AREA-0001"
        area_name:
          type: string
          example: "Indiranagar"
        city:
          type: string
          example: "Bangalore"
        state:
          type: string
          example: "Karnataka"
        country:
          type: string
          example: "India"
        pincode:
          type: string
          example: "560038"
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        geo_json:
          type: string
          description: Optional GeoJSON boundary for the area.
    PaginatedAreaList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Area'
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total_items:
          type: integer
          example: 120
        total_pages:
          type: integer
          example: 6
    PropertyAmenity:
      type: object
      properties:
        amenity_name:
          type: string
          example: "Gym"
    PropertyImage:
      type: object
      properties:
        image:
          type: string
          format: uri
          example: "https://cdn.example.com/properties/PROP-00001/1.jpg"
        caption:
          type: string
        sort_order:
          type: integer
    PropertySummary:
      type: object
      properties:
        id:
          type: string
          example: "PROP-00001"
        title:
          type: string
          example: "2 BHK Apartment in Indiranagar"
        listing_type:
          type: string
          enum: [Sale, Lease]
        property_type:
          type: string
          example: "Apartment"
        price:
          type: number
          format: float
          example: 7500000
        currency:
          type: string
          example: "INR"
        bedrooms:
          type: integer
          example: 2
        bathrooms:
          type: integer
          example: 2
        area_sqft:
          type: number
          format: float
          example: 1150
        city:
          type: string
          example: "Bangalore"
        area:
          type: string
          example: "AREA-0001"
        area_name:
          type: string
          example: "Indiranagar"
        developer:
          type: string
          example: "DEV-0001"
          description: Developer ID if assigned.
        developer_name:
          type: string
          example: "Sunrise Builders"
        primary_image_url:
          type: string
          format: uri
          example: "https://cdn.example.com/properties/PROP-00001/main.jpg"
        location:
          type: string
          example: "Indiranagar, Bangalore"
        furnishing_status:
          type: string
          example: "Furnished"
    PropertyDetail:
      allOf:
        - $ref: '#/components/schemas/PropertySummary'
        - type: object
          properties:
            status:
              type: string
              enum: [Draft, Under Verification, Active, Inactive]
            description:
              type: string
            latitude:
              type: number
              format: float
            longitude:
              type: number
              format: float
            address_line1:
              type: string
            address_line2:
              type: string
            state:
              type: string
            country:
              type: string
            pincode:
              type: string
            amenities:
              type: array
              items:
                type: string
            gallery:
              type: array
              items:
                $ref: '#/components/schemas/PropertyImage'
            agent:
              type: object
              properties:
                id:
                  type: string
                  example: "AGENT-0005"
                name:
                  type: string
                  example: "Rahul Sharma"
                phone:
                  type: string
                  example: "+91-9876543210"
                whatsapp_number:
                  type: string
                  example: "+91-9876543210"
            developer_id:
              type: string
              nullable: true
              description: Developer ID if assigned.
            developer_name:
              type: string
              nullable: true
            developer:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/DeveloperDetail'
            whatsapp_chat_link:
              type: string
              format: uri
              nullable: true
              example: "https://wa.me/919876543210?text=Hi%20I%20am%20interested%20in%20PROP-00001"
    PropertyCreateRequest:
      type: object
      required:
        - title
        - listing_type
        - property_type
        - price
        - currency
      properties:
        title:
          type: string
        description:
          type: string
        listing_type:
          type: string
          enum: [Sale, Lease]
        property_type:
          type: string
        price:
          type: number
          format: float
        currency:
          type: string
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        furnishing_status:
          type: string
          enum: [Furnished, Semi-Furnished, Unfurnished]
        area_sqft:
          type: number
          format: float
        area_id:
          type: string
          description: ID of Area
        developer_id:
          type: string
          description: ID of Developer
        address_line1:
          type: string
        address_line2:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        pincode:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        amenities:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/PropertyAmenity'
        gallery:
          type: array
          items:
            $ref: '#/components/schemas/PropertyImage'
        is_featured:
          type: boolean
        agent:
          type: string
          description: Optional explicit Agent ID (defaults to logged-in agent)
    PropertyUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/PropertyCreateRequest'
    PaginatedPropertyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PropertySummary'
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    DeveloperSummary:
      type: object
      properties:
        id:
          type: string
          example: "DEV-0001"
        name:
          type: string
          example: "Sunrise Builders"
        status:
          type: string
          enum: [Active, Inactive]
        city:
          type: string
          example: "Dubai"
        state:
          type: string
          example: "Dubai"
        country:
          type: string
          example: "UAE"
        website:
          type: string
          format: uri
          example: "https://sunrise.example.com"
        logo:
          type: string
          format: uri
          example: "https://cdn.example.com/developers/DEV-0001/logo.png"
        location:
          type: string
          example: "Dubai, UAE"
    DeveloperDetail:
      allOf:
        - $ref: '#/components/schemas/DeveloperSummary'
        - type: object
          properties:
            email:
              type: string
              format: email
              example: "info@sunrise.example.com"
            phone:
              type: string
              example: "+971500000001"
            address_line1:
              type: string
            address_line2:
              type: string
            pincode:
              type: string
            description:
              type: string
    DeveloperCreateRequest:
      type: object
      required: [developer_name]
      properties:
        developer_name:
          type: string
        status:
          type: string
          enum: [Active, Inactive]
        email:
          type: string
          format: email
        phone:
          type: string
        website:
          type: string
          format: uri
        address_line1:
          type: string
        address_line2:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        pincode:
          type: string
        logo:
          type: string
          format: uri
        description:
          type: string
    PaginatedDeveloperList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeveloperSummary'
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    FavoriteItem:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        property:
          $ref: '#/components/schemas/PropertySummary'
    FavoriteCreateRequest:
      type: object
      required: [property_id]
      properties:
        property_id:
          type: string
          example: "PROP-00001"
    AppointmentRequest:
      type: object
      required: [property_id, start_datetime, end_datetime]
      properties:
        property_id:
          type: string
          example: "PROP-00001"
        agent:
          type: string
          description: Optional Agent ID (defaults to property agent)
        start_datetime:
          type: string
          format: date-time
          example: "2025-12-10T10:00:00Z"
        end_datetime:
          type: string
          format: date-time
          example: "2025-12-10T11:00:00Z"
        notes:
          type: string
    AppointmentUpdateRequest:
      type: object
      properties:
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        notes:
          type: string
    Appointment:
      type: object
      properties:
        id:
          type: string
          example: "APPT-0001"
        status:
          type: string
          enum: [Scheduled, Completed, Cancelled, No-show]
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        notes:
          type: string
        source:
          type: string
          enum: [Mobile App, Web, Admin]
        customer:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            phone:
              type: string
            email:
              type: string
        agent:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            phone:
              type: string
            whatsapp_number:
              type: string
        property:
          $ref: '#/components/schemas/PropertySummary'
    WhatsAppLinkResponse:
      type: object
      properties:
        whatsapp_chat_link:
          type: string
          format: uri
  responses:
    UnauthorizedError:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Access forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new customer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login and get JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Reset password
      description: Directly sets a new password for the specified account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Password reset completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current JWT token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/user/profile:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    put:
      tags: [Users]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/areas:
    get:
      tags: [Areas]
      summary: List areas
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: city
          schema:
            type: string
      responses:
        '200':
          description: List of areas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAreaList'
  /api/areas/{area_id}:
    get:
      tags: [Areas]
      summary: Get area
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: area_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Area detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
  /api/areas/{area_id}/properties:
    get:
      tags: [Areas]
      summary: List properties in an area
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: area_id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: min_price
          schema:
            type: number
        - in: query
          name: max_price
          schema:
            type: number
      responses:
        '200':
          description: Properties in area
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyList'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/properties:
    get:
      tags: [Properties]
      summary: List properties
      description: Retrieve a paginated list of active properties with optional filters.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: listing_type
          schema:
            type: string
            enum: [Sale, Lease]
        - in: query
          name: min_price
          schema:
            type: number
        - in: query
          name: max_price
          schema:
            type: number
        - in: query
          name: property_types
          description: Filter by one or more property types.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: bedrooms
          description: Include properties matching any of the supplied bedroom counts.
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - in: query
          name: min_bedrooms
          schema:
            type: integer
        - in: query
          name: max_bedrooms
          schema:
            type: integer
        - in: query
          name: bathrooms
          description: Include properties matching any of the supplied bathroom counts.
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - in: query
          name: min_bathrooms
          schema:
            type: integer
        - in: query
          name: max_bathrooms
          schema:
            type: integer
        - in: query
          name: min_area
          description: Minimum built-up area (sq.ft).
          schema:
            type: number
        - in: query
          name: max_area
          description: Maximum built-up area (sq.ft).
          schema:
            type: number
        - in: query
          name: furnishing
          description: Filter by furnishing status (repeat parameter for multiple values).
          schema:
            type: array
            items:
              type: string
              enum: [Furnished, Semi-Furnished, Unfurnished]
          style: form
          explode: true
        - in: query
          name: amenities
          description: Require all of the specified amenities.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: location
          description: Text search across area, city, state, country, and address.
          schema:
            type: string
        - in: query
          name: area_id
          description: Filter by area ID (repeat parameter for multiple values).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: developer_id
          description: Filter by developer ID (repeat parameter for multiple values).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: agent
          schema:
            type: string
      responses:
        '200':
          description: Paginated properties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyList'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Properties]
      summary: Create property
      description: Create a new property listing (agents only).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyCreateRequest'
      responses:
        '201':
          description: Created property
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/properties/{property_id}:
    get:
      tags: [Properties]
      summary: Get property detail
      security: []
      parameters:
        - in: path
          name: property_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Property detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    put:
      tags: [Properties]
      summary: Update property
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: property_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyUpdateRequest'
      responses:
        '200':
          description: Updated property
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      tags: [Properties]
      summary: Deactivate property
      description: Soft delete by marking property as Inactive.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: property_id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Property deactivated
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/properties/{property_id}/whatsapp-link:
    get:
      tags: [Properties]
      summary: Get WhatsApp link for property agent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: property_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: WhatsApp chat link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppLinkResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/developers:
    get:
      tags: [Developers]
      summary: List developers
      security: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: page_size
          schema:
            type: integer
        - in: query
          name: status
