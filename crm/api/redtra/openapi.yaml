        name: appointment_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Review if exists
          content:
            application/json:
              schema:
                type: object
        '404':
          description: No review found
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
      - Appointments
      summary: Submit review for a completed appointment
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: appointment_id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - overall_rating
              - agent_rating
              - property_rating
              properties:
                overall_rating:
                  type: number
                  minimum: 0
                  maximum: 5
                agent_rating:
                  type: number
                  minimum: 0
                  maximum: 5
                property_rating:
                  type: number
                  minimum: 0
                  maximum: 5
                review_text:
                  type: string
      responses:
